# Render Blueprint – ATAS Döner & Pizza
#
# Render → New → Blueprint → dieses Repository wählen.
# Render legt den Service dann mit den Einstellungen unten an; abgefragt werden
# nur noch die als `sync: false` markierten Geheimnisse.
#
# Nach dem ersten Deploy:
#   1. Service-URL kopieren (z. B. https://atas-doener-pizza.onrender.com)
#   2. In config.js window.FLUEVATE_BACKEND auf genau diese URL setzen
#   3. Render → Connect/Outbound → Static Outbound IPs in MongoDB Atlas freigeben

services:
  - type: web
    name: atas-doener-pizza
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    # Bewusst /api/live und nicht /api/health: Letzteres meldet 503, solange
    # die Datenbank fehlt. Render wuerde den Dienst dann nie als gesund
    # ansehen, keinen Verkehr durchlassen und 502 zeigen - die Diagnose waere
    # damit unerreichbar.
    healthCheckPath: /api/live
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: FRONTEND_URL
        value: https://atas-doener-pizza.com

      # ── Datenbank ──
      - key: MONGODB_URI
        sync: false

      # ── Stripe ──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_ACCOUNT
        sync: false

      # ── PayPal: bewusst nicht eingerichtet ──
      # PayPal laeuft direkt auf das PayPal-Konto des Ladens (paypal-direkt.js) und
      # bleibt aus, bis im Hosting PAYPAL_CLIENT_ID und PAYPAL_CLIENT_SECRET der
      # Live-App UND PAYPAL_ENV=live stehen. Erst dann legt der Server seinen Webhook
      # (<API>/api/paypal-webhook) selbst an und die Seite zeigt PayPal (/api/config
      # paypal:true). Eine Sandbox gibt es nicht mehr. PAYPAL_ENV deshalb nie fest
      # hier eintragen, sonst wird PayPal mit dem naechsten Deploy scharf.
      # Optional: PAYPAL_WEBHOOK_ID (Webhook von Hand), PUBLIC_API_URL (falls die
      # API nicht unter https://api.atas-doener-pizza.com erreichbar ist).
      # Zustand: GET /api/admin/paypal (Admin-Anmeldung).

      # ── E-Mail (Resend) ──
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: bestellungen@atas-doener-pizza.com
      - key: RESTAURANT_EMAIL
        sync: false
      - key: OWNER_EMAIL
        sync: false

      # ── Zugang ──
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      # ── Sonstiges ──
      - key: WHATSAPP_NUMBER
        value: "4917620124957"
      - key: PRINTNODE_API_KEY
        sync: false
      - key: PRINTNODE_PRINTER_ID
        sync: false
